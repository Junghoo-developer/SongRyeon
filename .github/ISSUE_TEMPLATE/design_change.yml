name: Design change
description: Propose a change to an invariant, node contract or public schema.
title: "[Design] "
labels:
  - design
body:
  - type: textarea
    id: problem
    attributes:
      label: Observable problem
      description: State the failure before proposing a solution.
    validations:
      required: true
  - type: textarea
    id: invariant
    attributes:
      label: Invariants affected
      description: Explain what must remain true about A, R and exact source retention.
    validations:
      required: true
  - type: textarea
    id: acceptance
    attributes:
      label: Acceptance tests
      description: List deterministic checks that would close this issue.
    validations:
      required: true
  - type: textarea
    id: tradeoffs
    attributes:
      label: Cost and trade-offs
      description: Include model calls, context, latency and compatibility.
    validations:
      required: true
