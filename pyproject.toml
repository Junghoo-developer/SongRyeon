[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "songryeon-core"
version = "0.1.0"
description = "A local agent runtime that separates code-verified execution facts from model judgments."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["agent", "audit", "llm", "ollama", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8", "wheel>=0.40"]
codex = ["openai-codex==0.144.4"]

[project.scripts]
songryeon = "demo.cli:main"
songryeon-index = "knowledge.build_knowledge:main"
songryeon-model-scale = "evals.model_scale_capture:main"
songryeon-model-scale-verify = "evals.model_scale_verify:main"
songryeon-model-scale-review = "evals.model_scale_review_bundle:main"
songryeon-model-scale-review-verify = "evals.model_scale_review_verify:main"

[tool.setuptools.packages.find]
where = ["."]
namespaces = false
include = [
    "agent_tools*",
    "demo*",
    "evals*",
    "knowledge*",
    "llm*",
    "memory*",
    "metadata*",
    "nodes*",
    "prompts*",
    "runtime*",
]

[tool.setuptools.package-data]
evals = [
    "cases/*.json",
    "cases/*.py",
    "cases/project/*.py",
    "cases/project/nested/*.py",
    "contest_holdout_v1/manifest.json",
    "contest_holdout_v1/RUN_PLAN.json",
    "contest_holdout_v1/HUMAN_AUDIT_TEMPLATE.json",
    "contest_holdout_v1/*.md",
    "contest_holdout_v1/project/*.py",
    "contest_holdout_v1/frozen/*/FREEZE.json",
    "contest_holdout_v1/frozen/*/BLINDING_COMMITMENT.json",
    "contest_holdout_v1/frozen/*/BLIND_PACKET.json",
    "contest_holdout_v1/frozen/*/BLIND_SCORES.json",
    "contest_holdout_v1/frozen/*/SCORE_LOCK.json",
    "contest_holdout_v1/frozen/*/REVEAL.json",
    "contest_holdout_v1/frozen/*/SUMMARY.json",
    "contest_holdout_v1/frozen/*/HUMAN_AUDIT.json",
    "contest_holdout_v1/frozen/*/PUBLICATION_DECISION.json",
    "model_ceiling_cases/*.json",
    "model_ceiling_cases/*.py",
    "model_ceiling_cases/project/*.py",
]

[tool.pytest.ini_options]
# 어느 폴더에서 테스트를 시작해도 프로젝트 패키지를 찾게 한다.
pythonpath = ["."]
testpaths = ["tests"]

# 테스트가 만든 캐시 폴더로 학습용 구조가 지저분해지지 않게 한다.
addopts = "-p no:cacheprovider"
