[build-system]
requires = ["setuptools>=65"]
build-backend = "setuptools.build_meta"

[project]
name = "songryeon-core"
version = "0.1.0"
description = "A local agent runtime that separates code-verified execution facts from model judgments."
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
keywords = ["agent", "audit", "llm", "ollama", "provenance"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Topic :: Software Development :: Libraries",
]
dependencies = []

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
songryeon = "demo.cli:main"
songryeon-index = "knowledge.build_knowledge:main"

[tool.setuptools.packages.find]
where = ["."]
include = [
    "agent_tools*",
    "demo*",
    "evals*",
    "knowledge*",
    "llm*",
    "memory*",
    "metadata*",
    "nodes*",
    "prompts*",
    "runtime*",
]

[tool.setuptools.package-data]
evals = [
    "cases/*.json",
    "cases/*.py",
    "cases/project/*.py",
    "cases/project/nested/*.py",
]

[tool.pytest.ini_options]
# 어느 폴더에서 테스트를 시작해도 프로젝트 패키지를 찾게 한다.
pythonpath = ["."]
testpaths = ["tests"]

# 테스트가 만든 캐시 폴더로 학습용 구조가 지저분해지지 않게 한다.
addopts = "-p no:cacheprovider"
